    <meta charset="UTF-8" />

    <meta name="description" content="Official portfolio of Leema Rose Martin showcasing humanitarian initiatives, leadership, global awards, and social impact." />

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;700&family=Plus+Jakarta+Sans:ital,wght@0,300;0,400;0,500;0,600;0,700;0,800;1,400&display=swap" rel="stylesheet">

  <body class="bg-[#F8FAFC] text-slate-800 antialiased selection:bg-amber-100 selection:text-amber-900 font-['Plus_Jakarta_Sans',sans-serif]">
    <div id="root"></div>
    <script>
      // Restore the real URL saved by public/404.html's GitHub Pages SPA
      // redirect, before React reads location.pathname to pick a route.
      (function () {
        var redirect = sessionStorage.redirect;
        delete sessionStorage.redirect;
        if (redirect && redirect !== location.href) {
          history.replaceState(null, '', redirect);
        }
      })();
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
