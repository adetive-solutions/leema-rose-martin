<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Redirecting…</title>
<script>
  // GitHub Pages serves no server-side rewrites, so a direct link or hard
  // refresh on a route like /leema-rose-martin/about 404s here. Save the
  // intended URL and bounce to index.html, which restores it via
  // history.replaceState before the app mounts (see the script in index.html).
  sessionStorage.redirect = location.href;
</script>
<meta http-equiv="refresh" content="0; url=/leema-rose-martin/">
</head>
<body></body>
</html>
